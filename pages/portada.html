<section class="portada">
  <div class="portada__orb portada__orb--1"></div>
  <div class="portada__orb portada__orb--2"></div>
  <div class="portada__orb portada__orb--3"></div>

  <div class="portada__content">
    <p class="portada__kicker">Una celebración especial está por comenzar...</p>

    <h1 class="portada__title">¡Estás<br>invitado!</h1>

    <button id="openGift" class="portada__gift" type="button" aria-label="Abrir invitación">
      <svg viewBox="0 0 140 140" class="portada__giftSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#F9A8D4"/>
          </linearGradient>
        </defs>
        <g class="portada__giftLid">
          <rect x="14" y="34" width="112" height="26" rx="7" fill="#fff" stroke="#8B5CF6" stroke-width="3"/>
          <path d="M70 34C70 34 46 34 40 24C35 15.5 44 8 52.5 11.5C63 16 70 34 70 34Z" fill="url(#boxGrad)"/>
          <path d="M70 34C70 34 94 34 100 24C105 15.5 96 8 87.5 11.5C77 16 70 34 70 34Z" fill="url(#boxGrad)"/>
        </g>
        <rect x="20" y="60" width="100" height="62" rx="8" fill="url(#boxGrad)"/>
        <rect x="62" y="34" width="16" height="88" fill="#fff" opacity="0.9"/>
      </svg>
      <span class="portada__giftGlow"></span>
    </button>

    <p class="portada__text">
      Tengo una fecha muy especial para celebrar y quiero compartirla contigo.
    </p>

    <button id="openInvitation" class="btn btn--primary portada__cta" type="button">
      Ver invitación
    </button>

    <small class="portada__hint">Toca la caja para abrirla</small>
  </div>
</section>
