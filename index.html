<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cumple CAro - ¡Estás invitado!</title>
  <meta name="description" content="Invitación digital de cumpleaños de Carolina. Sábado 19 de septiembre.">

  <!-- Open Graph -->
  <meta property="og:title" content="Cumple CAro - ¡Estás invitado!">
  <meta property="og:description" content="Te invito a celebrar mi cumpleaños el sábado 19 de septiembre.">
  <meta property="og:image" content="assets/fotos/foto-principal.jpeg">
  <meta property="og:type" content="website">

  <!-- Aplica el tema guardado antes de pintar, evita parpadeo -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portada.css">
  <link rel="stylesheet" href="css/invitacion.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro">
    <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
    <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
  </button>

  <div id="app"></div>

  <script src="js/config.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/portada.js"></script>
  <script src="js/invitacion.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
